# Only relevant if STORAGE_MODE=git (e.g. deploying to Streamlit Community
# Cloud, which has ephemeral disk). If you're running STORAGE_MODE=local
# somewhere with a persistent volume, you don't need this - just run
# `python reindex.py` there directly (manually or your own cron).
name: Manual reindex

on:
  workflow_dispatch: {}

jobs:
  reindex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Reindex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
          DOMAIN_DESCRIPTION: ${{ secrets.DOMAIN_DESCRIPTION }}
          STORAGE_MODE: git
          # DATABASE_URL intentionally omitted: not set as a secret, so this
          # falls through to config.py's sqlite:///./local.db default. Only
          # add this back (with a Neon URL secret) if you switch off SQLite.
        run: |
          git config user.name "reindex-bot"
          git config user.email "actions@github.com"
          python reindex.py
